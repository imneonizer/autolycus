version: '3'

services:
  proxy:
    image: nginx:1.30.7-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
    links:
      - api
      - ui
    restart: on-failure:3

  api:
      build:
        context: ./api
      volumes:
        - ./downloads:/downloads
        - ./api:/app
        - ./logs:/app/logs
      environment:
        - FLASK_ENVIRONMENT=prod
        - POSTGRES_HOST=db
      env_file:
        - ./.env
      depends_on:
        - db
      restart: on-failure:3

  ui:
      build:
        context: ./ui
      volumes:
        - ./ui:/app
      environment:
        - API_URL=/api
      env_file:
        - ./.env
      restart: on-failure:3

  db:
    image: postgres:13-alpine
    volumes:
      - ./db:/var/lib/postgresql/data
    env_file:
      - ./.env
    restart: on-failure:3
